# Pipeline for the Next.js frontend. Stages, security scanning (SAST +
# Dependency + Secret + HIGH/CRITICAL gate) and the image supply chain (trivy
# scan, syft SBOM, cosign keyless sign + verify) come from the shared template
# in the utilities repo. Only the frontend-specific lint/test and build jobs
# live here; the build job re-homes onto the `build` stage and exports build.env
# so the supply-chain jobs can pick up IMAGE_REF/IMAGE_DIGEST.
include:
  - project: microservices1691715/utilities
    ref: main
    file: ci-templates/frontend.gitlab-ci.yml

stages:
  - test
  - scan
  - build
  - sign
  - promote

variables:
  DOCKER_IMAGE_NAME: "micro-market-frontend"
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  CLOUD_PROVIDER: "aws"
  ENVIRONMENT: "dev"
  PROJECT_NAMESPACE: "danielgherasim-microservices"
  CI_TOOLS_IMAGE: "${CONTAINER_REGISTRY_NAME}/${PROJECT_NAMESPACE}/${ENVIRONMENT}/ci-base-${CLOUD_PROVIDER}:latest"

.node_job:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .node_job
  stage: test
  script:
    - npm run lint

test:
  extends: .node_job
  stage: test
  script:
    - npm run test:run

build_and_push:
  stage: build
  image: ${CI_TOOLS_IMAGE}
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker info
    - chmod +x ./build.sh
  script:
    - ./build.sh
    # Export IMAGE_REF/IMAGE_DIGEST for the sign/promote stage jobs.
    - !reference [.export-image-ref, script]
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
