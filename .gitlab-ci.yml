stages:
  - test
  - build

variables:
  DOCKER_IMAGE_NAME: "micro-market-frontend"
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  CI_TOOLS_IMAGE: "${CONTAINER_REGISTRY_NAME}/java21-docker-azcli:latest"
  CLOUD_PROVIDER: "aws"
  ENVIRONMENT: "dev"
  PROJECT_NAMESPACE: "danielgherasim-microservices"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

.node_job:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .node_job
  stage: test
  script:
    - npm run lint

test:
  extends: .node_job
  stage: test
  script:
    - npm run test:run

build_and_push:
  stage: build
  image: ${CI_TOOLS_IMAGE}
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker info
    - chmod +x ./build.sh
  script:
    - ./build.sh
  only:
    - main
