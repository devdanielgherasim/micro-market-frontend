# GitLab CI/CD Pipeline for Micro Market Frontend
# This pipeline builds and pushes a Docker image to Azure Container Registry
stages:
  - test
  - build

variables:
  DOCKER_IMAGE_NAME: "micro-market-frontend"
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA

include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: test

build_and_push:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "Logging in to Azure Container Registry..."
    - echo "$ARM_CLIENT_SECRET" | docker login $CONTAINER_REGISTRY_NAME -u "$ARM_CLIENT_ID" --password-stdin
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG .
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:latest
    - echo "Docker image built successfully"

    - echo "Tagging Docker image for Azure Container Registry..."
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $CONTAINER_REGISTRY_NAME/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $CONTAINER_REGISTRY_NAME/$DOCKER_IMAGE_NAME:latest

    - echo "Pushing Docker image to Azure Container Registry..."
    - docker push $CONTAINER_REGISTRY_NAME/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker push $CONTAINER_REGISTRY_NAME/$DOCKER_IMAGE_NAME:latest

    - echo "Docker image pushed successfully to Azure Container Registry"
  only:
    - main
    - master
    - tags
